name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-and-import:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Smoke import
      run: |
        python -c "
        import sovharn
        import sovharn.core.memory
        import sovharn.core.spec_engine
        import sovharn.core.gate_keeper
        import sovharn.api.agents
        print('✅ sovharn 全部核心模块导入成功')
        "
